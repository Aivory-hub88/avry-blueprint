version: '3.8'

services:
  avry_blueprint:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: avry-blueprint
    ports:
      - "8083:8083"
    environment:
      - PORT=8083
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DATABASE_URL=${DATABASE_URL}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - aivory-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.avry-blueprint.rule=Host(`backend.aivory.id`) && PathPrefix(`/blueprints`)"
      - "traefik.http.routers.avry-blueprint.entrypoints=websecure"
      - "traefik.http.routers.avry-blueprint.tls.certresolver=letsencrypt"
      - "traefik.http.services.avry-blueprint.loadbalancer.server.port=8083"

networks:
  aivory-network:
    name: aivory-network
    external: true
